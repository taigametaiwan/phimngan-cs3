name: Update plugin catalog

on:
  push:
    branches: [main]
    paths:
      - 'addons/*.cs3'
      - 'scripts/generate_catalog.py'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate metadata
        run: python scripts/generate_catalog.py
      - name: Commit changed catalog
        run: |
          if git diff --quiet -- repo.json plugins.json && [ -z "$(git ls-files --others --exclude-standard icons)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repo.json plugins.json icons
          git commit -m 'Update CS3 plugin catalog'
          git push
